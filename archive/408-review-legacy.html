<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一篇学完 · 408 数据结构 · 可交互复习系统</title>
<style>
/* ================================================================
 * 「一篇学完」复习系统 v2.0
 * 设计系统：现代明亮卡片风 · 浅色主题
 * ================================================================ */
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --surface-3:#eef1f8;
  --border:#e5e8f2;
  --border-strong:#d8dce9;
  --text:#1c2333;
  --text-2:#4d5670;
  --text-3:#8a93a8;
  --accent:#4f6ef7;
  --accent-2:#7b96ff;
  --accent-soft:#eef1ff;
  --green:#16a34a;  --green-soft:#e8f7ee;
  --red:#e5484d;    --red-soft:#fdeef0;
  --amber:#d97706;  --amber-soft:#fdf3e3;
  --blue:#2563eb;   --blue-soft:#e8f0fe;
  --purple:#7c3aed; --purple-soft:#f1ebfe;
  --teal:#0d9488;   --teal-soft:#e6f7f5;
  --code-bg:#1f2634;
  --code-bar:#171d29;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(28,35,51,.05);
  --shadow-md:0 4px 16px rgba(28,35,51,.08);
  --shadow-lg:0 12px 40px rgba(28,35,51,.14);
  --font: -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  --mono: "SF Mono",Menlo,Consolas,"JetBrains Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14.5px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,110,247,.18)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;border:none;outline:none}
a{color:var(--accent);text-decoration:none}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:50;
  height:58px;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-logo{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:17px;font-weight:800;box-shadow:0 3px 8px rgba(79,110,247,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-title{font-size:15px;font-weight:800;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--text-3);font-weight:500}
.hamburger{
  display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center;
  font-size:17px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);
}
/* 资源切换 tabs */
.res-tabs{display:flex;align-items:center;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
.res-tabs::-webkit-scrollbar{display:none}
.res-tab{
  padding:5px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);
  white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s;
}
.res-tab:hover{color:var(--accent)}
.res-tab.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)}
.res-tab .dot{width:6px;height:6px;border-radius:50%}
.res-tab.active .dot{background:var(--accent)}
.res-tab.disabled{opacity:.45;cursor:not-allowed;font-weight:500}
.res-tab.disabled small{font-size:9.5px;color:var(--text-3)}
.res-tab.paper .dot{background:var(--purple)}
.res-tab.paper.active{color:var(--purple)}
/* 搜索 */
.search-wrap{position:relative;margin-left:auto;flex-shrink:0}
.search-box{
  display:flex;align-items:center;gap:7px;width:210px;height:34px;
  padding:0 12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;transition:all .2s;color:var(--text-3);
}
.search-box:focus-within{width:280px;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.13);color:var(--accent)}
.search-box svg{flex-shrink:0}
.search-box input{flex:1;background:none;font-size:13px;color:var(--text);min-width:0}
.search-box input::placeholder{color:var(--text-3)}
.search-clear{display:none;font-size:13px;color:var(--text-3);padding:2px 4px;border-radius:5px}
.search-clear:hover{color:var(--red);background:var(--red-soft)}
.search-box.has-text .search-clear{display:block}
/* 搜索下拉 */
.search-panel{
  position:absolute;top:42px;right:0;width:420px;max-width:88vw;max-height:430px;overflow:auto;
  background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);
  padding:8px;display:none;z-index:80;
}
.search-panel.show{display:block;animation:popIn .16s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.sp-group{padding:6px 10px 4px;font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase}
.sp-item{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .12s}
.sp-item:hover,.sp-item.hl{background:var(--accent-soft)}
.sp-item .t{font-size:13px;font-weight:600;color:var(--text)}
.sp-item .t mark{background:rgba(245,158,11,.35);color:inherit;border-radius:3px;padding:0 2px}
.sp-item .p{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-empty{padding:22px;text-align:center;color:var(--text-3);font-size:13px}
.sp-kbd{font-size:9.5px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:auto;align-self:flex-start}

/* ================= 进度条 ================= */
.progress-track{position:sticky;top:58px;z-index:49;height:3px;background:transparent}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:0 3px 3px 0;transition:width .08s linear}

/* ================= 布局 ================= */
.layout{display:flex;align-items:flex-start;max-width:1280px;margin:0 auto}
.sidebar{
  position:sticky;top:61px;align-self:flex-start;
  width:296px;flex-shrink:0;height:calc(100vh - 61px);overflow-y:auto;
  padding:20px 14px 40px;background:var(--surface);
  border-right:1px solid var(--border);
}
.sidebar::-webkit-scrollbar,.search-panel::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb,.search-panel::-webkit-scrollbar-thumb{background:#d3d8e6;border-radius:3px}
/* 资源信息卡 */
.res-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:linear-gradient(160deg,#fff,#f8faff);margin-bottom:16px}
.res-cover{display:flex;align-items:center;gap:12px}
.res-cover .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 4px 12px rgba(79,110,247,.3)}
.res-cover.paper .ic{background:linear-gradient(135deg,var(--purple),#a78bfa);box-shadow:0 4px 12px rgba(124,58,237,.3)}
.res-cover .nm{font-size:15.5px;font-weight:800}
.res-cover .st{font-size:11.5px;color:var(--text-3);margin-top:1px}
.res-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.res-prog{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--text-3)}
.res-prog .track{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.res-prog .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
/* 目录树 */
.toc-label{font-size:10.5px;font-weight:800;color:var(--text-3);letter-spacing:1px;padding:0 10px 6px}
.toc{}
.toc-ch{user-select:none}
.toc-ch-head{
  display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--text-2);transition:background .12s;
}
.toc-ch-head:hover{background:var(--surface-2)}
.toc-ch-head .num{font-size:10px;font-weight:800;color:var(--text-3);font-family:var(--mono);min-width:22px}
.toc-ch-head .chev{font-size:9px;color:var(--text-3);transition:transform .18s;margin-left:auto}
.toc-ch.open .chev{transform:rotate(90deg)}
.toc-ch-head.active{color:var(--accent);background:var(--accent-soft)}
.toc-ch-head.active .num{color:var(--accent)}
.toc-ch-body{display:none;margin-left:9px;padding-left:10px;border-left:1.5px solid var(--border)}
.toc-ch.open>.toc-ch-body{display:block;animation:fadeSlide .18s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.toc-bk{
  display:flex;align-items:center;gap:8px;padding:5.5px 9px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:var(--text-2);transition:all .12s;position:relative;
}
.toc-bk:hover{background:var(--surface-2);color:var(--text)}
.toc-bk.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.toc-bk.active::before{content:"";position:absolute;left:-5px;top:22%;bottom:22%;width:3px;border-radius:2px;background:var(--accent)}
.toc-bk .ic{font-size:12px;opacity:.85}
.toc-bk .done{font-size:10px;color:var(--green);margin-left:auto}
.sidebar-foot{margin-top:18px;padding:12px 10px 0;border-top:1px dashed var(--border);font-size:11px;color:var(--text-3);text-align:center}

/* ================= 内容区 ================= */
.main{flex:1;min-width:0;padding:26px 38px 90px}
.content{max-width:860px;margin:0 auto}
.chapter-head{margin:6px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.ch-num{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);
  background:var(--accent-soft);border:1px solid rgba(79,110,247,.18);margin-bottom:10px;
}
.ch-title{font-size:27px;font-weight:850;letter-spacing:-.3px;line-height:1.3}
.ch-summary{margin-top:8px;font-size:13.5px;color:var(--text-2);max-width:70ch}
.ch-meta{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:11.5px;color:var(--text-3)}
.ch-meta b{color:var(--text-2);font-weight:700}
/* 块卡片 */
.blocks{display:flex;flex-direction:column;gap:18px}
.block{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px 20px 20px;box-shadow:var(--shadow-sm);
  border-left:4px solid var(--accent);
  scroll-margin-top:84px;transition:box-shadow .18s,border-color .18s;
}
.block:hover{box-shadow:var(--shadow-md)}
.block.t-concept{border-left-color:var(--blue)}
.block.t-code{border-left-color:#334155}
.block.t-table{border-left-color:var(--purple)}
.block.t-animation{border-left-color:var(--amber)}
.block.t-error{border-left-color:var(--red)}
.block.t-keypoint{border-left-color:var(--amber)}
.block.t-formula{border-left-color:var(--teal)}
.block.flash{animation:flashBorder 1.4s ease}
@keyframes flashBorder{0%,60%{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.28)}100%{border-color:var(--accent)}}
.block-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.block-ic{
  width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;background:var(--blue-soft);border:1px solid rgba(37,99,235,.12);
}
.t-code .block-ic{background:#e9edf5;border-color:#d5dbe8}
.t-table .block-ic{background:var(--purple-soft);border-color:rgba(124,58,237,.12)}
.t-animation .block-ic{background:var(--amber-soft);border-color:rgba(217,119,6,.12)}
.t-error .block-ic{background:var(--red-soft);border-color:rgba(229,72,77,.14)}
.t-keypoint .block-ic{background:var(--amber-soft);border-color:rgba(217,119,6,.12)}
.t-formula .block-ic{background:var(--teal-soft);border-color:rgba(13,148,136,.12)}
.block-title{font-size:15.5px;font-weight:800;line-height:1.35;padding-top:3px}
.block-title .ic-note{font-size:11px;font-weight:600;color:var(--text-3);margin-left:7px}
.block-tags{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;padding-top:4px;flex-shrink:0}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.tag.t-hot{background:var(--red-soft);color:var(--red)}
.tag.t-mid{background:var(--amber-soft);color:var(--amber)}
.tag.t-low{background:var(--surface-3);color:var(--text-3)}
.block-body{font-size:14px;color:var(--text)}
.block-body p{margin:0 0 8px}
.block-body ul,.block-body ol{margin:0 0 8px;padding-left:22px}
.block-body li{margin:3.5px 0}
.block-body li::marker{color:var(--accent)}
/* 行内标记 */
.mk-key{color:var(--red);font-weight:800;background:linear-gradient(transparent 62%,rgba(229,72,77,.14) 62%);border-radius:2px}
.mk-mem{color:var(--amber);font-weight:700;background:linear-gradient(transparent 62%,rgba(217,119,6,.16) 62%);border-radius:2px}
.mk-code{font-family:var(--mono);font-size:.88em;background:var(--surface-3);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:#475069}
.mk-mnemonic{display:block;background:var(--amber-soft);border:1px solid rgba(217,119,6,.22);border-left:3px solid var(--amber);border-radius:9px;padding:9px 13px;margin:8px 0;font-size:13.5px;color:#7c4a03;font-weight:600}
.mk-warn{display:block;background:var(--red-soft);border:1px solid rgba(229,72,77,.2);border-left:3px solid var(--red);border-radius:9px;padding:9px 13px;margin:8px 0;font-size:13.5px;color:#9f1d22}
/* 公式 */
.formula{
  background:var(--teal-soft);border:1px solid rgba(13,148,136,.18);border-left:3px solid var(--teal);
  border-radius:9px;padding:10px 14px;margin:9px 0;font-family:var(--mono);font-size:13.5px;
  color:#0f5250;overflow-x:auto;white-space:pre-wrap;
}
/* 折叠详解 */
.reveal{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}
.reveal summary{
  list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--accent);padding:5px 12px;border-radius:8px;
  background:var(--accent-soft);border:1px solid rgba(79,110,247,.15);transition:background .15s;user-select:none;
}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary:hover{background:#e3e9ff}
.reveal summary .chev{font-size:9px;transition:transform .18s}
.reveal[open] summary .chev{transform:rotate(90deg)}
.reveal-body{margin-top:11px;padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;font-size:13.5px;animation:fadeSlide .2s ease}
.reveal-body p{margin-bottom:7px}
.reveal-body .sub-h{font-size:12px;font-weight:800;color:var(--text-2);margin:10px 0 5px}
.reveal-body .sub-h:first-child{margin-top:0}

/* ================= 代码块 ================= */
.code-block{border-radius:12px;overflow:hidden;border:1px solid #171c28;margin:9px 0;box-shadow:var(--shadow-sm)}
.code-bar{
  display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--code-bar);
}
.code-dots{display:flex;gap:5px}
.code-dots i{width:9.5px;height:9.5px;border-radius:50%;display:block}
.code-dots i:nth-child(1){background:#ff5f57}.code-dots i:nth-child(2){background:#febc2e}.code-dots i:nth-child(3){background:#28c840}
.code-lang{font-size:11px;font-weight:700;color:#8b94a7;font-family:var(--mono)}
.code-copy{
  margin-left:auto;font-size:11px;font-weight:700;color:#8b94a7;padding:3px 10px;border-radius:6px;
  border:1px solid #2c3547;background:transparent;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.code-copy:hover{color:#fff;border-color:#4f6ef7;background:rgba(79,110,247,.2)}
.code-copy.ok{color:#4ade80;border-color:#16a34a}
.code-pre{background:var(--code-bg);overflow-x:auto;padding:12px 0 14px}
.code-line{display:flex;padding:0 16px;white-space:pre;font-family:var(--mono);font-size:12.8px;line-height:1.7}
.code-line:hover{background:rgba(255,255,255,.035)}
.code-line .ln{width:30px;flex-shrink:0;text-align:right;padding-right:14px;color:#4d5568;user-select:none;font-size:11px;line-height:1.9}
.code-line .src{flex:1}
.tok-c{color:#7f8ea3;font-style:italic}            /* 注释 */
.tok-s{color:#7ee0a3}                              /* 字符串 */
.tok-k{color:#c792ea}                              /* 关键字 */
.tok-t{color:#ffcb6b}                              /* 类型名 */
.tok-n{color:#f78c6c}                              /* 数字 */
.tok-f{color:#82aaff}                              /* 函数 */
.code-explain{margin-top:2px;border-top:1px solid var(--border);background:var(--surface-2);padding:11px 15px;font-size:12.5px;color:var(--text-2);line-height:1.8}
.code-explain .lnx{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;margin-right:6px}
.complexity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:11px}
.cx-item{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:7px 10px;text-align:center}
.cx-item .cx-label{display:block;font-size:10.5px;color:var(--text-3);font-weight:600;margin-bottom:1px}
.cx-item .cx-value{display:block;font-size:13.5px;font-weight:800;font-family:var(--mono);color:var(--accent)}
.cx-item.green .cx-value{color:var(--green)}
.cx-item.red .cx-value{color:var(--red)}

/* ================= 表格 ================= */
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:auto;margin:9px 0}
.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
.data-table th{
  background:var(--surface-3);color:var(--text-2);font-weight:700;text-align:left;
  padding:9px 14px;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--border-strong);
}
.data-table td{padding:8.5px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--surface-2)}
.data-table td mark{background:rgba(245,158,11,.35);border-radius:3px;padding:0 2px}
td.stable-yes{color:var(--green);font-weight:700}
td.stable-no{color:var(--red);font-weight:700}
.table-note{margin-top:8px;font-size:12.5px;color:var(--text-2);background:var(--amber-soft);border-radius:9px;padding:8px 12px;display:flex;gap:7px;align-items:flex-start}
.table-note::before{content:"💡";flex-shrink:0}

/* ================= 易错卡 ================= */
.err-item{margin:9px 0;border-radius:11px;overflow:hidden;border:1px solid var(--border)}
.err-head{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;font-weight:800;background:var(--surface-3);color:var(--text-2)}
.err-wrong,.err-right{display:flex;gap:9px;padding:9px 14px;font-size:13px;line-height:1.7;align-items:flex-start}
.err-wrong{background:var(--red-soft);color:#9f1d22}
.err-right{background:var(--green-soft);color:#116b35}
.err-wrong::before{content:"✗";font-weight:900;color:var(--red);flex-shrink:0}
.err-right::before{content:"✓";font-weight:900;color:var(--green);flex-shrink:0}
.err-why{margin:9px 0 2px;font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:9px;padding:9px 13px}
.err-why::before{content:"🔍 原因：";font-weight:800;color:var(--accent)}

/* ================= 动画 ================= */
.anim-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:9px 0;background:var(--surface-2)}
.anim-canvas{display:block;width:100%;height:300px;background:#fbfcff}
.anim-modes{display:flex;gap:4px;padding:9px 12px 0;flex-wrap:wrap}
.mode-chip{

typedef struct {
    int data[MaxSize];   // 存放元素
    int length;          // 当前长度
} SqList;

// 插入：在位置 i（1-based）插入 e
bool ListInsert(SqList &L, int i, int e){
    if (i < 1 || i > L.length + 1) return false;  // 越界
    if (L.length >= MaxSize) return false;        // 表满

    L.data[i - 1] = e;
    L.length++;
    return true;
}

// 删除：删除位置 i 的元素，用 e 带回
bool ListDelete(SqList &L, int i, int &e){
    if (i < 1 || i > L.length) return false;
    e = L.data[i - 1];
    for (int j = i; j < L.length; j++)            // 前移

    L.length--;
    return true;
}

      code:`typedef struct LNode {
    int data;
    struct LNode *next;
} LNode, *LinkList;

// 头插法建表：读入顺序与链表顺序相反
LinkList List_HeadInsert(LinkList &L){
    LNode *s; int x;
    L = (LinkList)malloc(sizeof(LNode));
    L->next = NULL;                    // 带头结点
    scanf("%d", &x);
    while (x != 9999) {
        s = (LNode*)malloc(sizeof(LNode));
        s->data = x;
        s->next = L->next;             // 新结点插到头结点之后
        L->next = s;
        scanf("%d", &x);
    }
    return L;
}

// 按位插入：在位置 i 插入 e（带头结点）
bool ListInsert(LinkList &L, int i, int e){
    if (i < 1) return false;
    LNode *p = L; int j = 0;
    while (p != NULL && j < i - 1) {   // 找第 i-1 个结点
        p = p->next; j++;
    }
    if (p == NULL) return false;       // i 超出表长
    LNode *s = (LNode*)malloc(sizeof(LNode));
    s->data = e;
    s->next = p->next;                 // 关键：先连后断

    return true;
}

    if (p->next == NULL) return false;
    q = p->next;
    p->next = q->next;

/* ================================================================
 * 3. 行内标记渲染：**重点**  [口诀]  `代码`  ==记忆==  &gt; 引用
 * ================================================================ */
function inlineMarkup(s){
  if(!s) return '';
  let out = esc(s);
  // 先保护代码高亮输出不会二次转义（此处输入均为原始字符串）
  out = out
    .replace(/==([^=\n]+)==/g, '<mark class="mk-mem">$1</mark>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b class="mk-key">$1</b>')
    .replace(/`([^`\n]+)`/g, '<code class="mk-code">$1</code>');
  // 口诀块与警示块（独立成块，用标记包裹在行首）
  out = out
    .replace(/\[\[口诀\]\]\s*([^\n]+)/g, '<div class="mk-mnemonic">🔑 $1</div>')
    .replace(/\[\[警示\]\]\s*([^\n]+)/g, '<div class="mk-warn">⚠️ $1</div>');
  // 换行转 <br>
  return out;
}

const C_KEYWORDS = 'auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while';
function highlightCode(code){
  if(!code) return '';
  const src = esc(code);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(?:'+C_KEYWORDS+')\b|\b(int|float|double|char|void|long|short|unsigned|signed|bool|struct|typedef|const)\b|\b(0[xX][0-9a-fA-F]+|\d+\.?\d*)\b/g;
  return src.replace(re, (m, c, s, k, t, n)=>{
    if(c) return '<span class="tok-c">'+c+'</span>';
    if(s) return '<span class="tok-s">'+s+'</span>';
    if(k) return '<span class="tok-k">'+k+'</span>';
    if(t) return '<span class="tok-t">'+t+'</span>';
    if(n) return '<span class="tok-n">'+n+'</span>';
    return m;
  });
}

function renderChapter(res, chId){
  const ch = res.chapters.find(c=>c.id===chId) || res.chapters[0];
  if(!ch) return;
  ACTIVE_CH_ID = ch.id;
  const blocks = (ch.blocks||[]).map(b=>{
    b.id = b.id || uid('blk');
    const r = BlockRenderers[b.type];
    return r
      ? '<article class="block t-'+b.type+'" id="'+b.id+'" data-block="'+b.id+'">'+r(b)+'</article>'
      : '';
  }).join('');
  const idx = res.chapters.indexOf(ch);
  const prev = idx>0 ? res.chapters[idx-1] : null;
  const next = idx<res.chapters.length-1 ? res.chapters[idx+1] : null;
  const nav =
    '<div class="ch-nav">'+
    (prev?'<button class="ch-nav-btn" data-goto="'+prev.id+'"><span class="dir">← 上一章</span><span class="nm">'+esc(prev.title)+'</span></button>'
         :'<button class="ch-nav-btn disabled"></button>')+
    (next?'<button class="ch-nav-btn next" data-goto="'+next.id+'"><span class="dir">下一章 →</span><span class="nm">'+esc(next.title)+'</span></button>'
         :'<button class="ch-nav-btn disabled"></button>')+
    '</div>';
  const sec = document.getElementById('content');
  sec.innerHTML =
    '<section class="chapter" id="ch-'+ch.id+'">'+
    '<div class="chapter-head">'+
    '<span class="ch-num">第 '+ch.num+' 章 · '+esc(ch.titleEn||'')+'</span>'+
    '<h1 class="ch-title">'+esc(ch.title)+'</h1>'+
    (ch.summary?'<p class="ch-summary">'+inlineMarkup(ch.summary)+'</p>':'')+
    '<div class="ch-meta">'+
    (ch.blocks?'<span>📚 <b>'+ch.blocks.length+'</b> 个考点块</span>':'')+
    (ch.est?'<span>⏱ 建议 <b>'+ch.est+'</b></span>':'')+
    '</div></div>'+
    '<div class="blocks">'+blocks+'</div>'+nav+'</section>';
  renderSidebar(res);
  updateProgress(res);
  document.getElementById('content').scrollTop = 0;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  initAnimations();
  initCopyButtons();
  bindChapterNav();
  requestAnimationFrame(()=>{ initScrollSpy(); });
}

 * 7. 搜索（跨当前资源全部章节，下拉结果面板）
 * ================================================================ */
function initSearch(){
  const input = document.getElementById('search-input');
  const panel = document.getElementById('search-panel');
  const box = document.getElementById('search-box');
  const clear = document.getElementById('search-clear');
  const search = debounce(function(){
    const q = input.value.trim().toLowerCase();
    box.classList.toggle('has-text', !!q);
    if(!q){ panel.classList.remove('show'); return; }
    const res = getActiveRes();
    const hits = flattenBlocks(res).filter(f=>f.text.toLowerCase().includes(q)).slice(0,14);
    if(!hits.length){
      panel.innerHTML = '<div class="sp-empty">未找到与「'+esc(input.value)+'」相关的内容<br>试试：KMP / 快排 / 循环队列…</div>';
    } else {
      const groups = {};
      hits.forEach(h=>{ (groups[h.chapter.title]=groups[h.chapter.title]||[]).push(h); });
      panel.innerHTML = Object.keys(groups).map(gt=>{
        return '<div class="sp-group">'+esc(gt)+'</div>'+
          groups[gt].map(h=>{
            const hl = t=>t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
            const snippet = h.text.length>70 ? h.text.slice(0,70)+'…' : h.text;
            return '<div class="sp-item" data-goto="'+h.block.id+'" data-ch="'+h.chapter.id+'">'+
              '<span class="t">'+(CARD_ICONS[h.block.type]||'')+' '+hl(esc(h.block.title||'未知'))+'</span>'+
              '<span class="p">'+hl(esc(snippet))+'</span></div>';
          }).join('');
      }).join('');
    }
    panel.classList.add('show');
  }, 180);
  input.addEventListener('input', search);
  input.addEventListener('focus', ()=>{ if(input.value.trim()) search(); });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.search-wrap')) panel.classList.remove('show');
  });
  clear.addEventListener('click', ()=>{ input.value=''; search(); input.focus(); });
  /* 回车：跳转第一个结果 */
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const first = panel.querySelector('.sp-item');
      if(first) { first.click(); panel.classList.remove('show'); }
    }
  });
  /* 结果面板点击跳转 */
  panel.addEventListener('click', e=>{
    const item = e.target.closest('.sp-item');
    if(!item) return;
    const res = getActiveRes();
    const targetId = item.dataset.goto;
    if(ACTIVE_CH_ID !== item.dataset.ch){
      renderChapter(res, item.dataset.ch);
    }
    panel.classList.remove('show');
    setTimeout(()=>flashBlock(targetId), 60);
  });
}

  const el = document.getElementById(id);

  ACTIVE_BLOCK_ID = id;
  updateTocActive();

function initScrollSpy(){
  const blocks = Array.from(document.querySelectorAll('.block'));
  const items = Array.from(document.querySelectorAll('.toc-bk'));
  const update = () => {
    if(!blocks.length) return;
    let cur = blocks[0];
    for(const b of blocks){ if(b.getBoundingClientRect().top <= 130) cur = b; else break; }
    ACTIVE_BLOCK_ID = cur.id;
    items.forEach(it=>it.classList.toggle('active', it.dataset.goto===cur.id));
    /* 章节头自动展开 */
    const chEl = cur.closest('.toc-ch');
    if(chEl && !chEl.classList.contains('open')){
      chEl.classList.add('open');
    }
    document.querySelectorAll('.toc-ch-head').forEach(h=>{
      h.classList.toggle('active', h.dataset.goto===ACTIVE_CH_ID);
    });
  };
  window.addEventListener('scroll', ()=>requestAnimationFrame(update), {passive:true});
  update();
}
function initProgressBar(){
  const bar = document.getElementById('progress-bar');
  const onScroll = () => {
    const h = document.documentElement;
    const max = h.scrollHeight - window.innerHeight;
    bar.style.width = (max>0 ? (window.scrollY/max)*100 : 0)+'%';
  };
  window.addEventListener('scroll', ()=>requestAnimationFrame(onScroll), {passive:true});
  onScroll();
}
function updateProgress(res){
  const total = res.chapters.reduce((a,c)=>a+(c.blocks?c.blocks.length:0),0);
  const done = res.chapters.reduce((a,c)=>a+(c.blocks?c.blocks.filter(b=>b.doneFlag).length:0),0);
  if(res.meta){ res.meta.progress = total? Math.round(done/total*100):0; }
  const card = document.getElementById('res-card');
  if(card && res.meta){
    const fill = card.querySelector('.res-prog .fill');
    const label = card.querySelector('.res-prog span:last-child');
    if(fill) fill.style.width = res.meta.progress+'%';
    if(label) label.textContent = res.meta.progress+'%';
  }
}

  document.querySelectorAll('.toc-bk').forEach(it=>{
    it.classList.toggle('active', it.dataset.goto===ACTIVE_BLOCK_ID);

function initSidebarToggle(){

function goHandler(e){
  const el = e.target.closest('[data-goto]');
  if(!el) return;
  const res = getActiveRes();

  const isChapter = res.chapters.some(c=>c.id===id);

function copyHandler(e){
  const btn = e.currentTarget;
  const block = btn.closest('.code-block');
  const code = block.getAttribute('data-code');
  const done = ()=>{ btn.textContent='✓ 已复制'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='⧉ 复制'; btn.classList.remove('ok'); },1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code,done));

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(err){}
  document.body.removeChild(ta); cb();
}
/* ================================================================
 * 9. 动画引擎（逻辑画布 680×300，自适应容器宽度）
 * ================================================================ */
const LOGIC_W = 680, LOGIC_H = 300;
const ALL_ANIMS = [];
class AnimationBase {
  constructor(canvas, config){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.config = config || {};
    this.isPlaying = false;
    this.speed = 1;
    this.currentStep = 0;
    this.steps = [];
    this.lastStepTime = 0;
    this.stepInterval = 650;
    this.rafId = null;
    this.statusEl = null;
    this.mode = (config && config.mode) || null;
    this._fit();
    this.generateSteps();
    this.render();
    ALL_ANIMS.push(this);
  }
  _fit(){
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = Math.max(320, Math.floor(rect.width));
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = w * dpr;
    this.canvas.height = LOGIC_H * dpr;
    this.ctx.setTransform(this.canvas.width/LOGIC_W, 0, 0, this.canvas.height/LOGIC_H, 0, 0);
  }
  generateSteps(){}
  render(){}
  setMode(mode){ if(this.mode !== null){ this.mode = mode; this.generateSteps(); this.currentStep = 0; } }
  play(){
    if(this.currentStep >= this.steps.length) this.reset();
    this.isPlaying = true;
    this.lastStepTime = performance.now();
    if(this.statusEl) this.statusEl.classList.remove('done');
    this._loop();
  }
  pause(){
    this.isPlaying = false;
    if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId = null; }
  }
  reset(){
    this.pause();
    this.currentStep = 0;
    this.render();
    this._setStatus('就绪，点击播放');
  }
  stepForward(){
    this.pause();
    if(this.currentStep < this.steps.length){
      this.currentStep++;
      this.render();
      this._setStatus();
    } else this._setStatus('✓ 完成');
  }
  setSpeed(s){ this.speed = parseFloat(s) || 1; }
  _loop(){
    if(!this.isPlaying) return;
    const now = performance.now();
    if(now - this.lastStepTime >= this.stepInterval/this.speed){
      if(this.currentStep < this.steps.length){
        this.currentStep++;
        this.render();
        this._setStatus();
        this.lastStepTime = now;
      } else {
        this.pause();
        this._setStatus('✓ 动画完成');
        return;
      }
    }
    this.rafId = requestAnimationFrame(()=>this._loop());
  }
  _setStatus(msg){
    if(this.statusEl){
      const step = this.steps[this.currentStep-1];
      const txt = msg || (step && step.desc) || ('步骤 '+this.currentStep+'/'+this.steps.length);
      this.statusEl.textContent = txt;
      this.statusEl.classList.toggle('done', /✓|完成/.test(txt));
    }
  }
  /* 绘图辅助（逻辑坐标 680×300） */
  _clear(w,h,color){ this.ctx.fillStyle = color || '#fbfcff'; this.ctx.fillRect(0,0,w||LOGIC_W,h||LOGIC_H); }
  _text(str,x,y,size,color,align,bold){
    const ctx = this.ctx;
    ctx.fillStyle = color || '#3a4150';
    ctx.font = (bold?'bold ':'') + (size||13) + 'px "SF Mono",Menlo,Consolas,sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str,x,y);
  }
  _roundRect(x,y,w,h,r){
    const ctx=this.ctx; ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
}

/* 动画工厂 */
const AnimationFactories = {};
/* ==================== 排序动画公共绘制 ==================== */
function drawSortBars(anim, arr, opts){
  const ctx=anim.ctx, w=LOGIC_W, h=LOGIC_H;
  const o=opts||{};
  const compare=o.compare||[], swap=o.swap||[];
  const sortedSet=o.sortedSet||new Set();
  const n=arr.length, padL=30, padR=30, padT=44, padB=34;
  const maxV=Math.max.apply(null,arr);
  const bw=(w-padL-padR)/n;
  anim._clear(w,h);
  if(o.title) anim._text(o.title, w/2, 16, 13, '#5c6470','center');
  if(o.subtitle) anim._text(o.subtitle, w/2, 31, 10.5, '#98a0ae','center');
  for(let i=0;i<n;i++){
    const bh=Math.max(4,(arr[i]/maxV)*(h-padT-padB));
    const x=padL+i*bw, y=h-padB-bh;
    let color='#5b9bd5';
    if(sortedSet.has(i)) color='#16a34a';
    if(compare.indexOf(i)>-1) color='#f59e0b';
    if(swap.indexOf(i)>-1) color='#e5484d';
    if(o.pivot===i) color='#8e44ad';
    if(o.boundary!==undefined && i>=o.boundary && !sortedSet.has(i)) color='rgba(155,89,182,.3)';
    ctx.fillStyle=color;
    anim._roundRect(x+1.5, y, bw-3, bh, 3); ctx.fill();
    anim._text(String(arr[i]), x+bw/2, h-padB+13, 10, '#98a0ae');
  }
  if(o.pivotLow!==undefined && o.pivotHigh!==undefined && o.pivotLow<o.pivotHigh){
    const x1=padL+o.pivotLow*bw+bw/2, x2=padL+o.pivotHigh*bw+bw/2;
    ctx.strokeStyle='rgba(142,68,173,.5)'; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x1, padT-12); ctx.lineTo(x2, padT-12); ctx.stroke();
    ctx.setLineDash([]);
  }
  if(o.mergeLow!==undefined && o.mergeHigh!==undefined){
    const x1=padL+o.mergeLow*bw+bw/2, x2=padL+o.mergeHigh*bw+bw/2;
    ctx.strokeStyle='rgba(52,152,219,.7)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x1,h-padB+3); ctx.lineTo(x2,h-padB+3); ctx.stroke();
    ctx.fillStyle='rgba(52,152,219,.22)';
    anim._roundRect(x1-bw/2,h-padB-4,(x2-x1)+bw,10,4); ctx.fill();
    ctx.lineWidth=1;
  }
}

/* ==================== 冒泡排序 ==================== */
class BubbleSortAnimation extends AnimationBase {
  generateSteps(){
    const arr=[...this.config.data], n=arr.length;
    const sortedSet=new Set(); this.steps=[];
    for(let i=0;i<n-1;i++){
      let swapped=false;
      for(let j=0;j<n-1-i;j++){
        this.steps.push({type:'compare',arr:[...arr],compare:[j,j+1],sortedSet:new Set(sortedSet),
          desc:'比较 '+arr[j]+' 与 '+arr[j+1]});
        if(arr[j]>arr[j+1]){
          const a=arr[j],b=arr[j+1];
          [arr[j],arr[j+1]]=[arr[j+1],arr[j]];
          this.steps.push({type:'swap',arr:[...arr],swap:[j,j+1],sortedSet:new Set(sortedSet),
            desc:'交换 '+a+' 与 '+b});
          swapped=true;
        }
      }
      sortedSet.add(n-1-i);
      this.steps.push({type:'mark',arr:[...arr],sortedSet:new Set(sortedSet),
        desc:'位置 '+(n-1-i)+' 已确定'});
      if(!swapped){ for(let k=0;k<=n-2-i;k++) sortedSet.add(k); break; }
    }
    for(let k=0;k<n;k++) sortedSet.add(k);
    this.steps.push({type:'done',arr:[...arr],sortedSet:new Set(sortedSet),desc:'✓ 排序完成'});
  }
  render(){
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    const arr=st?st.arr:this.config.data;
    drawSortBars(this,arr,{title:'冒泡排序 · 相邻逆序交换',compare:st&&st.compare||[],swap:st&&st.swap||[],sortedSet:st&&st.sortedSet||new Set()});
  }
}

/* ==================== 快速排序 ==================== */
class QuickSortAnimation extends AnimationBase {
  generateSteps(){
    const arr=[...this.config.data];
    const sortedSet=new Set(); this.steps=[];
    const record=(type,extra)=>this.steps.push(Object.assign({type,arr:[...arr],sortedSet:new Set(sortedSet)},extra));
    const partition=(low,high)=>{
      const pivot=arr[high];
      record('pivot',{pivot,pivotIndex:high,low,high,desc:'选择枢轴 '+pivot+'（末尾元素）'});
      let i=low-1;
      for(let j=low;j<high;j++){
        record('compare',{compare:[j],pivot,pivotIndex:high,low,high,desc:'比较 '+arr[j]+' 与枢轴 '+pivot});
        if(arr[j]<pivot){
          i++;
          if(i!==j){
            const a=arr[i],b=arr[j];
            [arr[i],arr[j]]=[arr[j],arr[i]];
            record('swap',{swap:[i,j],pivot,pivotIndex:high,low,high,desc:'交换 '+a+' 与 '+b});
          }
        }
      }
      if(i+1!==high){
        const a=arr[i+1],b=arr[high];
        [arr[i+1],arr[high]]=[arr[high],arr[i+1]];
        record('swap',{swap:[i+1,high],pivot,pivotIndex:high,low,high,desc:'枢轴 '+b+' 归位（交换 '+a+' 与 '+b+'）'});
      }
      return i+1;
    };
    const qs=(low,high)=>{
      if(low<high){
        const p=partition(low,high);
        sortedSet.add(p);
        record('sorted',{sorted:[p],low,high,desc:'位置 '+p+' 已确定'});
        qs(low,p-1); qs(p+1,high);
      } else if(low===high && !sortedSet.has(low)){
        sortedSet.add(low);
        record('sorted',{sorted:[low],low,high,desc:'位置 '+low+' 已确定'});
      }
    };
    qs(0,arr.length-1);
    for(let k=0;k<arr.length;k++) sortedSet.add(k);
    record('done',{desc:'✓ 排序完成'});
  }
  render(){
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    const arr=st?st.arr:this.config.data;
    drawSortBars(this,arr,{title:'快速排序 · 分治划分',pivot:st&&st.pivotIndex!==undefined?st.pivotIndex:-1,
      compare:st&&st.compare||[],swap:st&&st.swap||[],sortedSet:st&&st.sortedSet||new Set(),
      pivotLow:st&&st.low, pivotHigh:st&&st.high});
  }
}

/* ==================== 堆排序 ==================== */
class HeapSortAnimation extends AnimationBase {
  generateSteps(){
    const arr=[...this.config.data], n=arr.length;
    const sortedSet=new Set(); this.steps=[];
    let heapSize=n;
    const rec=(type,extra)=>this.steps.push(Object.assign({type,arr:[...arr],sortedSet:new Set(sortedSet),heapSize},extra));
    const sift=(i,size)=>{
      while(true){
        let largest=i, l=2*i+1, r=2*i+2;
        if(l<size){
          rec('compare',{compare:[i,l],desc:'比较 '+arr[i]+' 与 '+arr[l]});
          if(arr[l]>arr[largest]) largest=l;
        }
        if(r<size){
          rec('compare',{compare:[largest,r],desc:'比较 '+arr[largest]+' 与 '+arr[r]});
          if(arr[r]>arr[largest]) largest=r;
        }
        if(largest!==i){
          const a=arr[i],b=arr[largest];
          [arr[i],arr[largest]]=[arr[largest],arr[i]];
          rec('swap',{swap:[i,largest],desc:'交换 '+a+' 与 '+b+'（下沉调整）'});
          i=largest;
        } else break;
      }
    };
    for(let i=Math.floor(n/2)-1;i>=0;i--){
      rec('build',{desc:'构建大根堆 · 堆化位置 '+i});
      sift(i,n);
    }
    rec('buildDone',{desc:'✓ 大根堆构建完成，堆顶 = '+arr[0]});
    for(let i=n-1;i>0;i--){
      const a=arr[0],b=arr[i];
      [arr[0],arr[i]]=[arr[i],arr[0]];
      sortedSet.add(i); heapSize=i;
      rec('extract',{swap:[0,i],desc:'堆顶 '+a+' 与末尾 '+b+' 交换'});
      sift(0,heapSize);
    }
    sortedSet.add(0);
    rec('done',{desc:'✓ 排序完成'});
  }
  render(){
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    const arr=st?st.arr:this.config.data;
    drawSortBars(this,arr,{title:'堆排序 · 大根堆 + 堆顶下沉',boundary:st&&st.heapSize!==undefined?st.heapSize:undefined,
      compare:st&&st.compare||[],swap:st&&st.swap||[],sortedSet:st&&st.sortedSet||new Set()});
  }
}

/* ==================== 归并排序 ==================== */
class MergeSortAnimation extends AnimationBase {
  generateSteps(){
    const arr=[...this.config.data];
    const sortedSet=new Set(); this.steps=[];
    const rec=(type,extra)=>this.steps.push(Object.assign({type,arr:[...arr],sortedSet:new Set(sortedSet)},extra));
    const temp=[];
    const merge=(low,mid,high)=>{
      rec('mergeStart',{mergeLow:low,mergeHigh:high,desc:'合并区间 ['+low+','+high+']'});
      let i=low,j=mid+1,k=0;
      while(i<=mid && j<=high){
        rec('compare',{compare:[i,j],mergeLow:low,mergeHigh:high,desc:'比较 '+arr[i]+' 与 '+arr[j]});
        if(arr[i]<=arr[j]) temp[k++]=arr[i++];
        else temp[k++]=arr[j++];
      }
      while(i<=mid){ temp[k++]=arr[i++]; }
      while(j<=high){ temp[k++]=arr[j++]; }
      for(let t=0;t<k;t++){
        arr[low+t]=temp[t];
        rec('copy',{copy:[low+t],mergeLow:low,mergeHigh:high,desc:'写入 '+temp[t]+' 到位置 '+(low+t)});
      }
      rec('mergeDone',{mergeLow:low,mergeHigh:high,desc:'区间 ['+low+','+high+'] 合并完成'});
    };
    const ms=(low,high)=>{
      if(low<high){
        const mid=Math.floor((low+high)/2);
        rec('divide',{mergeLow:low,mergeHigh:high,desc:'划分 ['+low+','+mid+'] 与 ['+(mid+1)+','+high+']'});
        ms(low,mid); ms(mid+1,high); merge(low,mid,high);
      }
    };
    ms(0,arr.length-1);
    for(let k=0;k<arr.length;k++) sortedSet.add(k);
    rec('done',{desc:'✓ 排序完成'});
  }
  render(){
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    const arr=st?st.arr:this.config.data;
    drawSortBars(this,arr,{title:'归并排序 · 分而治之',
      compare:st&&st.compare||[],swap:st&&st.swap||[],sortedSet:st&&st.sortedSet||new Set(),
      mergeLow:st&&st.mergeLow!==undefined?st.mergeLow:undefined,
      mergeHigh:st&&st.mergeHigh!==undefined?st.mergeHigh:undefined});
  }
}

/* ==================== 二叉树遍历 ==================== */
class TreeTraversalAnimation extends AnimationBase {
  constructor(canvas, config){
    super(canvas, Object.assign({}, config, {mode:(config&&config.mode)||'preorder'}));
  }
  get tree(){
    return {
      1:{v:'1',l:2,r:3,x:340,y:40},
      2:{v:'2',l:4,r:5,x:200,y:110},
      3:{v:'3',l:null,r:6,x:480,y:110},
      4:{v:'4',l:null,r:null,x:120,y:180},
      5:{v:'5',l:7,r:null,x:280,y:180},
      6:{v:'6',l:null,r:null,x:560,y:180},
      7:{v:'7',l:null,r:null,x:220,y:250}
    };
  }
  generateSteps(){
    const mode=this.mode||'preorder';
    const order=[]; const t=this.tree;
    const f=(id)=>{
      if(id===null||id===undefined) return;
      if(mode==='preorder') order.push(id);
      f(t[id].l);
      if(mode==='inorder') order.push(id);
      f(t[id].r);
      if(mode==='postorder') order.push(id);
    };
    f(1);
    const names={preorder:'先序遍历（根→左→右）',inorder:'中序遍历（左→根→右）',postorder:'后序遍历（左→右→根）'};
    this.steps=[];
    const visited=[];
    order.forEach((nid,idx)=>{
      visited.push(nid);
      this.steps.push({node:nid,visited:[...visited],desc:'第 '+(idx+1)+' 步：访问节点 '+t[nid].v});
    });
    this.steps.push({node:null,visited:[...visited],desc:'✓ 遍历完成，序列：'+visited.map(id=>t[id].v).join(' → ')});
    this.traversalName=names[mode];
  }
  render(){
    const ctx=this.ctx,w=LOGIC_W,h=LOGIC_H;
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    this._clear(w,h);
    this._text(this.traversalName||'二叉树遍历', w/2, 14, 13, '#5c6470');
    const t=this.tree;
    ctx.strokeStyle='#b8c2d4'; ctx.lineWidth=1.5;
    Object.keys(t).forEach(k=>{
      const n=t[k];
      if(n.l){ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(t[n.l].x,t[n.l].y);ctx.stroke();}
      if(n.r){ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(t[n.r].x,t[n.r].y);ctx.stroke();}
    });
    const visited=st?st.visited:[];
    const vs=new Set(visited);
    Object.keys(t).forEach(k=>{
      const n=t[k];
      const isCur=st&&st.node===n.id;
      const isVis=vs.has(n.id);
      ctx.beginPath();ctx.arc(n.x,n.y,20,0,Math.PI*2);
      ctx.fillStyle=isCur?'#e5484d':(isVis?'#16a34a':'#5b9bd5');
      ctx.fill();
      ctx.strokeStyle=isCur?'#c0392b':(isVis?'#15803d':'#2980b9');
      ctx.lineWidth=isCur?3:1.5; ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.v,n.x,n.y);
      if(isVis&&!isCur){
        const oi=visited.indexOf(n.id);
        ctx.beginPath();ctx.arc(n.x+17,n.y-17,9,0,Math.PI*2);
        ctx.fillStyle='#f59e0b';ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';
        ctx.fillText(oi+1,n.x+17,n.y-17);
      }
    });
    this._text('遍历序列：'+(visited.length?visited.map(id=>t[id].v).join(' → '):'（尚未开始，点击播放）'), w/2, h-14, 12, '#4d5670');
  }
}

/* ==================== 图遍历 BFS/DFS ==================== */
class GraphTraversalAnimation extends AnimationBase {
  constructor(canvas, config){
    super(canvas, Object.assign({}, config, {mode:(config&&config.mode)||'bfs'}));
  }
  get graph(){
    return {
      nodes:[
        {id:0,label:'A',x:100,y:70},{id:1,label:'B',x:290,y:70},
        {id:2,label:'C',x:100,y:210},{id:3,label:'D',x:290,y:210},
        {id:4,label:'E',x:480,y:70},{id:5,label:'F',x:480,y:210}
      ],
      adj:[[1,2],[0,3,4],[0,3],[1,2,5],[1,5],[3,4]]
    };
  }
  generateSteps(){
    const g=this.graph, mode=this.mode||'bfs';
    const visited=[], disc=new Set([0]);
    this.steps=[];
    if(mode==='bfs'){
      const q=[0];
      this.steps.push({visit:null,container:[...q],visited:[],desc:'从 A 出发，A 入队'});
      while(q.length){
        const u=q.shift();
        visited.push(u);
        this.steps.push({visit:u,container:[...q],visited:[...visited],desc:'出队访问 '+g.nodes[u].label});
        g.adj[u].forEach(v=>{
          if(!disc.has(v)){disc.add(v);q.push(v);
            this.steps.push({visit:null,container:[...q],visited:[...visited],desc:g.nodes[u].label+' 的邻点 '+g.nodes[v].label+' 入队'});}
        });
      }
    } else {
      const s=[0];
      this.steps.push({visit:null,container:[...s],visited:[],desc:'从 A 出发，A 压栈'});
      while(s.length){
        const u=s.pop();
        visited.push(u);
        this.steps.push({visit:u,container:[...s],visited:[...visited],desc:'出栈访问 '+g.nodes[u].label});
        const nbrs=g.adj[u].filter(v=>!disc.has(v));
        [...nbrs].reverse().forEach(v=>{
          disc.add(v);s.push(v);
          this.steps.push({visit:null,container:[...s],visited:[...visited],desc:g.nodes[u].label+' 的邻点 '+g.nodes[v].label+' 压栈'});
        });
      }
    }
    this.steps.push({visit:null,container:[],visited:[...visited],desc:'✓ 遍历完成，顺序：'+visited.map(i=>g.nodes[i].label).join(' → ')});
  }
  render(){
    const ctx=this.ctx,w=LOGIC_W,h=LOGIC_H;
    const g=this.graph;
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    const mode=this.mode||'bfs';
    this._clear(w,h);
    this._text(mode==='bfs'?'广度优先遍历 BFS · 队列':'深度优先遍历 DFS · 栈', w/2, 14, 13, '#5c6470');
    ctx.strokeStyle='#b8c2d4';ctx.lineWidth=1.5;
    g.adj.forEach((nbrs,u)=>{nbrs.forEach(v=>{if(v>u){ctx.beginPath();ctx.moveTo(g.nodes[u].x,g.nodes[u].y);ctx.lineTo(g.nodes[v].x,g.nodes[v].y);ctx.stroke();}});});
    const visited=st?st.visited:[];
    const vs=new Set(visited);
    g.nodes.forEach(n=>{
      const isCur=st&&st.visit===n.id, isVis=vs.has(n.id);
      ctx.beginPath();ctx.arc(n.x,n.y,24,0,Math.PI*2);
      ctx.fillStyle=isCur?'#e5484d':(isVis?'#16a34a':'#5b9bd5');
      ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.label,n.x,n.y);
      if(isVis&&!isCur){
        const oi=visited.indexOf(n.id);
        ctx.beginPath();ctx.arc(n.x+19,n.y-19,9,0,Math.PI*2);
        ctx.fillStyle='#f59e0b';ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';
        ctx.fillText(oi+1,n.x+19,n.y-19);
      }
    });
    const ctr=st?st.container:[];
    this._text(mode==='bfs'?'队列：':'栈：', 14, h-36, 12, '#5c6470','left');
    ctr.forEach((nid,idx)=>{
      const x=70+idx*42;
      ctx.fillStyle='#eef4fb';ctx.strokeStyle='#9db8d2';
      this._roundRect(x,h-50,36,28,5);ctx.fill();ctx.stroke();
      this._text(g.nodes[nid].label,x+18,h-36,13,'#2c3e50');
    });
    this._text('访问顺序：'+(visited.length?visited.map(i=>g.nodes[i].label).join(' → '):'（尚未开始，点击播放）'), w/2, h-8, 11, '#4d5670');
  }
}

/* ==================== KMP 匹配 ==================== */
class KMPAnimation extends AnimationBase {
  constructor(canvas, config){ super(canvas, config); }
  get main(){ return this.config.main || 'ABABABCABAB'; }
  get pat(){ return this.config.pattern || 'ABABC'; }
  generateSteps(){
    const main=this.main, pat=this.pat;
    this.next=this._buildNext(pat);
    this.steps=[];
    let i=0,j=0;
    while(i<main.length){
      if(j===-1||main[i]===pat[j]){
        this.steps.push({i,j,match:true,desc:'比较 main['+i+']='+main[i]+' 与 pat['+j+']='+pat[j]+' ✓ 相同'});
        i++;j++;
        if(j===pat.length){
          this.steps.push({i,j,match:null,done:true,start:i-j,desc:'✓ 匹配成功！模式串在主串中出现的位置 = '+(i-j)});
          break;
        }
      } else {
        this.steps.push({i,j,match:false,desc:'比较 main['+i+']='+main[i]+' 与 pat['+j+']='+pat[j]+' ✗ 失配 → j 回退到 next['+j+']='+this.next[j]});
        j=this.next[j];
      }
    }
    if(j!==pat.length && i>=main.length){
      this.steps.push({i:i,j:j,match:null,done:false,desc:'主串扫描完毕，未找到匹配'});
    }
  }
  _buildNext(p){
    const next=new Array(p.length).fill(0); next[0]=-1;
    let j=0,k=-1;
    while(j<p.length-1){
      if(k===-1||p[j]===p[k]){j++;k++;next[j]=k;}
      else k=next[k];
    }
    return next;
  }
  render(){
    const ctx=this.ctx,w=LOGIC_W,h=LOGIC_H;
    const st=this.steps[Math.min(this.currentStep,this.steps.length-1)];
    this._clear(w,h);
    this._text('KMP 字符串匹配 · 主串 "'+this.main+'"  模式串 "'+this.pat+'"', w/2, 14, 13, '#5c6470');
    const bw=38,bh=44,x0=30;
    const start=st?(st.i-st.j):0;
    ctx.font='11px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle='#5c6470';ctx.fillText('主串 S',8,72);
    for(let k=0;k<this.main.length;k++){
      const x=x0+k*bw;
      const isCur=st&&st.i===k&&!st.done;
      ctx.fillStyle=isCur?'#fdf3e3':'#f4f6f8';
      ctx.strokeStyle=isCur?'#d97706':'#d0d7de';
      ctx.lineWidth=isCur?2.5:1;
      this._roundRect(x+1,50,bw-2,bh,6);ctx.fill();ctx.stroke();ctx.lineWidth=1;
      this._text(this.main[k],x+bw/2,50+bh/2,15,'#2c3e50');
    }
    ctx.fillStyle='#5c6470';ctx.fillText('模式串 P',8,152);
    for(let k=0;k<this.pat.length;k++){
      const x=x0+(start+k)*bw;
      const isCur=st&&st.j===k&&!st.done;
      const isMatched=st&&st.match===true&&st.j===k;
      const isFailed=st&&st.match===false&&st.j===k;
      ctx.fillStyle=isMatched?'#e8f7ee':(isFailed?'#fdeef0':(isCur?'#fdf3e3':'#eef4fb'));
      ctx.strokeStyle=isMatched?'#16a34a':(isFailed?'#e5484d':(isCur?'#d97706':'#9db8d2'));
      ctx.lineWidth=isCur?2.5:1;
      this._roundRect(x+1,130,bw-2,bh,6);ctx.fill();ctx.stroke();ctx.lineWidth=1;
      this._text(this.pat[k],x+bw/2,130+bh/2,15,'#2c3e50');
    }
    ctx.fillStyle='#5c6470';ctx.font='11px sans-serif';ctx.fillText('next 数组',8,222);
    for(let k=0;k<this.next.length;k++){
      const x=x0+k*46;
      const isUsed=st&&st.match===false&&st.j===k;
      ctx.fillStyle=isUsed?'#fdf3e3':'#f8f9fa';
      ctx.strokeStyle='#d0d7de';
      this._roundRect(x+1,206,42,30,5);ctx.fill();ctx.stroke();
      this._text(String(this.next[k]),x+22,221,13,isUsed?'#d97706':'#5c6470');
    }
    if(st&&st.done&&st.match===null){
      this._text('✓ 匹配成功！出现位置 = '+st.start, w/2, 258, 14, '#16a34a','center',true);
    } else {
      const lines=st?st.desc.split('\n'):['就绪'];
      this._text(lines[0],w/2,258,12,'#5c6470');
    }
    if(st) this._text('i='+st.i+'  j='+st.j, w/2, 278, 11, '#98a0ae');
  }
}

/* 注册其余动画工厂 */
AnimationFactories.treeTraversal=(c,cfg)=>new TreeTraversalAnimation(c,cfg);
AnimationFactories.graphTraversal=(c,cfg)=>new GraphTraversalAnimation(c,cfg);
AnimationFactories.huffman=(c,cfg)=>new HuffmanAnimation(c,cfg);
AnimationFactories.kmp=(c,cfg)=>new KMPAnimation(c,cfg);

/* ================================================================
 * 10. 初始化
 * ================================================================ */
function initAnimations(){
  pendingAnimations.forEach(p=>{
    const canvas = document.getElementById('canvas-'+p.id);
    if(!canvas) return;
    const factory = AnimationFactories[p.animType];
    if(!factory) return;
    const anim = factory(canvas, p.animConfig);
    anim.statusEl = document.getElementById('status-'+p.id);
    const bind = (id, fn) => { const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
    bind('play-'+p.id, ()=>anim.play());
    bind('pause-'+p.id, ()=>anim.pause());
    bind('step-'+p.id, ()=>anim.stepForward());
    bind('reset-'+p.id, ()=>anim.reset());
    const speedSel = document.getElementById('speed-'+p.id);
    if(speedSel) speedSel.addEventListener('change', e=>anim.setSpeed(e.target.value));
    /* 模式切换（chip） */
    canvas.parentElement.querySelectorAll('.mode-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        canvas.parentElement.querySelectorAll('.mode-chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        anim.setMode(chip.dataset.mode);
        anim.reset();
      });
    });
    anim.reset();
  });
}

function init(){
  if(!LIBRARY.resources.length) return;
  setActiveRes(LIBRARY.resources[0].id);
  /* 资源切换 */
  document.getElementById('res-tabs').addEventListener('click', e=>{
    const t = e.target.closest('.res-tab');
    if(!t || t.classList.contains('disabled')) return;
    if(t.dataset.id === ACTIVE_RES_ID) return;
    setActiveRes(t.dataset.id);
    const res = getActiveRes();
    ACTIVE_CH_ID = res.chapters[0].id;
    ACTIVE_BLOCK_ID = null;
    renderResourceTabs();
    renderChapter(res, res.chapters[0].id);
    document.getElementById('brand-sub').textContent = (res.meta && res.meta.unit) || res.subtitle;
  });
  /* 侧边栏点击（章节/块跳转）——委托 */
  document.getElementById('toc').addEventListener('click', e=>{
    const el = e.target.closest('[data-goto]');
    if(!el) return;
    e.preventDefault();
    const res = getActiveRes();
    const id = el.dataset.goto;
    if(res.chapters.some(c=>c.id===id)){
      renderChapter(res, id);
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    } else if(el.dataset.blockTarget){
      ACTIVE_BLOCK_ID = id; updateTocActive();
      const node = document.getElementById(id);
      if(node){ node.scrollIntoView({behavior:'smooth', block:'start'}); node.classList.add('flash'); setTimeout(()=>node.classList.remove('flash'),1400); }
    }
  });
  /* 章导航按钮（上一章/下一章）——委托 */
  document.getElementById('content').addEventListener('click', e=>{
    const btn = e.target.closest('.ch-nav-btn[data-goto]');
    if(btn) renderChapter(getActiveRes(), btn.dataset.goto);
  });
  const res = getActiveRes();
  document.getElementById('brand-sub').textContent = (res.meta && res.meta.unit) || res.subtitle;
  renderResourceTabs();
  renderChapter(res, res.chapters[0].id);
  initProgressBar();
  initSearch();
  initSidebarToggle();
  window.addEventListener('resize', debounce(()=>{
    ALL_ANIMS.forEach(a=>{ a._fit(); a.render(); });
  }, 120));
}
document.addEventListener('DOMContentLoaded', init);
</script>
